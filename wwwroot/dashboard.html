<!DOCTYPE html><html lang=es><head><meta charset=UTF-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Proxy Dashboard</title>
<style>
body{font:14px -apple-system,sans-serif;margin:0;padding:16px;background:#f4f4f4;color:#333}
h1{border-bottom:2px solid #06c;padding-bottom:8px;font-size:20px}h2{color:#444;margin-top:18px;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:7px;margin:8px 0}
.card{background:#fff;border-radius:8px;padding:10px;box-shadow:0 2px 4px rgba(0,0,0,.1)}
.card h3{margin:0 0 3px;font-size:10px;color:#888}.card .value{font-size:16px;font-weight:bold}
.green{color:#22c55e}.red{color:#ef4444}.blue{color:#3b82f6}.orange{color:#f59e0b}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 4px rgba(0,0,0,.1);margin:6px 0}
th,td{padding:5px 7px;text-align:left;border-bottom:1px solid #eee;font-size:10px}
th{background:#1a1a1a;color:#fff;font-size:9px;text-transform:uppercase}tr:hover{background:#f0f7ff}
.tag{display:inline-block;padding:1px 5px;border-radius:6px;font-size:8px;font-weight:bold}
.free{color:#22c55e}.paid{color:#f59e0b}.premium{color:#ef4444}
.elo{background:#e8f4e8;color:#166534;padding:1px 4px;border-radius:3px;font-size:9px}
.badge{display:inline-block;padding:1px 4px;border-radius:3px;font-size:9px;background:#e2e8f0}
.nav{display:flex;gap:5px;margin:8px 0;flex-wrap:wrap}
.nav a{padding:4px 9px;background:#fff;border-radius:5px;text-decoration:none;color:#06c;font-size:11px;box-shadow:0 1px 2px rgba(0,0,0,.1)}.nav a:hover{background:#06c;color:#fff}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:7px;margin:6px 0}
.kpi{background:#fff;padding:7px;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.08);font-size:10px;line-height:1.5}.kpi strong{color:#06c}
.refresh{font-size:9px;color:#999}
</style></head><body>
<h1>🤖 AI Proxy Dashboard <span class=refresh>🔄 auto-refresh 5s</span></h1>
<div class=nav><a href=/>Dash</a><a href=/usage>JSON</a><a href=/usage/pricing>💰 Precios</a><a href=/health>Health</a></div>
<div id=c style=text-align:center;padding:30px;color:#999>⏳ Cargando...</div>
<span id=lu style=font-size:9px;color:#ccc></span>
<script>
function L(){try{fetch('/usage').then(function(r){return r.json()}).then(function(d){fetch('/usage/pricing').then(function(p){return p.json()}).then(function(p){R(d,p.pricing)})})}catch(e){c.innerHTML='Error'}}
function R(d,p){var tr=0,tc=d.total_cost_usd,tt=0,ac=0,al=0;d.models.forEach(function(m){tr+=m.requests;tt+=m.tokens_in+m.tokens_out;if(m.requests>0)ac++;if(m.success_rate_pct>0)al+=m.latency_avg_ms});if(ac>0)al=al/ac;var rh=d.uptime_hours>0?tr/d.uptime_hours:0;
var h='<div class=stats>'+card('Uptime',d.uptime_hours.toFixed(1)+'h','blue')+card('Requests',tr,'blue')+card('Costo','$'+tc.toFixed(4),tc>0.01?'orange':'green')+card('Latencia',Math.round(al)+'ms','blue')+card('Tokens',Math.round(tt/1000)+'K','blue')+card('Modelos',ac,'blue')+card('Req/h',Math.round(rh),'blue')+'</div>';
h+='<h2>KPIs para Developers</h2><div class=kpi-grid>';
h+=kpi('<b>Mejor ROI</b>',p.filter(function(x){return x.arena_elo}).sort(function(a,b){return(b.arena_elo/b.output_per_m)-(a.arena_elo/a.output_per_m)}).slice(0,4).map(function(x){return '<span class=elo>ELO '+x.arena_elo+'</span> '+x.provider+'/'+x.model+' <b>$'+x.output_per_m+'/M</b>'}).join('<br>'));
h+=kpi('<b>Mas rapidos</b>',p.sort(function(a,b){return(b.estimated_tps||0)-(a.estimated_tps||0)}).slice(0,4).map(function(x){return x.provider+'/'+x.model+' <span class=badge>'+(x.estimated_tps||'-')+' t/s</span>'}).join('<br>'));
h+=kpi('<b>GRATIS</b>',p.filter(function(x){return x.tier==='free'}).map(function(x){return x.provider+'/'+x.model+' <span class=tag free>free</span>'}).join('<br>'));
h+=kpi('<b>1000 reqs</b>',p.filter(function(x){return x.tier!=='free'}).map(function(x){var c=1000*((5000/1000000)*x.input_per_m+(1000/1000000)*x.output_per_m);return Object.assign({},x,{c:c})}).sort(function(a,b){return a.c-b.c}).slice(0,4).map(function(x){return x.provider+'/'+x.model+' <b>$'+x.c.toFixed(1)+'</b> <span class=badge>$'+x.output_per_m+'/M</span>'}).join('<br>'));
h+='</div><h2>Uso en Vivo</h2>';
if(d.models.length>0){h+='<table><thead><tr><th>Prov</th><th>Modelo</th><th>Tier</th><th>Req</th><th>OK%</th><th>Lat</th><th>In</th><th>Out</th><th>Costo</th><th>ELO</th></tr></thead><tbody>';
d.models.sort(function(a,b){return b.cost_usd-a.cost_usd}).forEach(function(m){h+='<tr><td>'+m.provider+'</td><td><b>'+m.model+'</b></td><td><span class=tag '+m.tier+'>'+m.tier+'</span></td><td>'+m.requests+'</td><td>'+m.success_rate_pct+'%</td><td>'+(m.latency_avg_ms>0?Math.round(m.latency_avg_ms)+'ms':'-')+'</td><td>'+Math.round(m.tokens_in/1000)+'K</td><td>'+Math.round(m.tokens_out/1000)+'K</td><td>'+(m.cost_usd>0?'$'+m.cost_usd.toFixed(6):'$0')+'</td><td>'+(m.arena&&m.arena.elo?'<span class=elo>ELO '+m.arena.elo+'</span>':'-')+'</td></tr>'});h+='</tbody></table>'}else{h+='<div style=text-align:center;padding:25px;color:#999>Sin requests. Hace POST /v1/chat/completions.</div>'}
h+='<p style=color:#999;font-size:10px;margin-top:15px>Proxy v2026.06.27</p>';
c.innerHTML=h;lu.textContent='Actualizado: '+new Date().toLocaleTimeString()}
function card(l,v,co){return '<div class=card><h3>'+l+'</h3><div class=value '+co+'>'+v+'</div></div>'}
function kpi(t,h){return '<div class=kpi>'+t+'<br>'+h+'</div>'}
L();setInterval(L,5000);
</script></body></html>

services:
  ai-proxy-hub:
    build: .
    image: ai-proxy-hub:latest
    container_name: ai-proxy-hub
    ports:
      - "${PROXY_PORT:-11434}:${PROXY_PORT:-11434}"
    env_file:
      - .env
    volumes:
      # Keeps data/usage-rollup.json across container recreations. Without it every
      # `docker compose up --force-recreate` resets the month-to-date token counters and the
      # free-tier budget page starts again from zero.
      - ai-proxy-hub-data:/app/data
    restart: unless-stopped
    healthcheck:
      # The .NET runtime image ships neither wget nor curl, so the old wget probe could never run and
      # every container reported "unhealthy" while the proxy was answering 200 perfectly well. bash's
      # /dev/tcp needs no extra package and still asserts a real HTTP 200 rather than just an open
      # socket — a proxy that accepts connections but 500s on /health is not healthy.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/${PROXY_PORT:-11434} && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # deploy:
    #   resources:
    #     limits:
    #       memory: 256M

volumes:
  ai-proxy-hub-data:
